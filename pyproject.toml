[project]
name = "trevyn"
version = "0.1.0"
description = "Trevyn core: control plane, orchestrator, Playwright runner, demo shop"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sse-starlette>=2.1", "pydantic>=2.8", "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30", "aiosqlite>=0.20", "asyncpg>=0.29", "httpx>=0.27",
  "playwright>=1.47", "anthropic>=1.0", "jinja2>=3.1", "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/contracts/trevyn_contracts", "services/api/trevyn_api", "workers/orchestrator/trevyn_orch",
  "workers/playwright-runner/trevyn_runner", "scenarios/demo-shop/demo_shop",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
